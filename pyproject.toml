[project]
name = "cse445-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shithil17", email = "shuhadashithil17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.28.0",
]

[project.scripts]
cse445-llm = "cse445_llm:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
